spring:
  datasource:
    url: jdbc:sqlite::memory:?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  jpa:
    hibernate:
      # NOTE: production runs with `none` (no schema validation). Tests must
      # match that so we don't trip on SQLite INTEGER vs Hibernate BIGINT type
      # mismatch (SQLite INTEGER is 8-byte, JPA Long defaults to BIGINT).
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  messages:
    basename: messages
    fallback-to-system-locale: false

restaurant:
  data-dir: build/test-data
  uploads-dir: build/test-uploads
  backups-dir: build/test-backups
  logs-dir: build/test-logs
  config-dir: build/test-config
  jwt:
    issuer: restaurant-server-test
    expiration-hours: 1
  rate-limit:
    login:
      attempts: 5
      window-minutes: 15
  backup:
    retention-daily: 5
    retention-weekly: 2
    schedule-cron: "0 0 0 1 1 ?"
    timezone: UTC
  fcm:
    enabled: false
    project-id: ""
    credentials-path: firebase-service-account.json
    dry-run: true
    stale-after-days: 30